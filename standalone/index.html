<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>AI-PDLC: как меняется процесс создания продукта с использованием AI — бесплатный курс</title>
<meta name="description" content="AI-PDLC: как меняется процесс создания продукта с использованием AI. Бесплатный курс на 52 минуты для участников производственных команд и всех, кто хочет понять, как устроено создание продукта в ближайшие годы: что такое AI-PDLC, чем отличается от привычного процесса разработки на конкретном примере, что будет с людьми, деньгами и контролем. 8 модулей и ответы на частые вопросы.">
<meta property="og:title" content="AI-PDLC: как меняется процесс создания продукта с использованием AI">
<meta property="og:description" content="Курс для тех, кто принимает решения: что это, чем отличается от привычной разработки и что меняет в деньгах, людях и контроле">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ykononov.com/aipdlc">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1A24;
  --ink-70:rgba(11,26,36,.70);
  --ink-45:rgba(11,26,36,.45);
  --ink-15:rgba(11,26,36,.15);
  --blueprint:#1D4E6B;
  --blueprint-soft:#6E93A8;
  --paper:#E6EAEC;
  --paper-2:#F2F5F6;
  --hivis:#E9B824;
  --signal:#B4381F;
  --ok:#2F6B4F;
  --rail:64px;
  --maxw:760px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background-color:#E6EAEC}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Unbounded',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
a{color:var(--blueprint);text-decoration:none;border-bottom:1px solid rgba(29,78,107,.35)}
a:hover{border-bottom-color:var(--blueprint)}
:focus-visible{outline:2px solid var(--blueprint);outline-offset:3px}

.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:11px 20px;
  background:rgba(230,234,236,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--ink-15);
}
.brand{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blueprint);background:none;border:0;padding:0;cursor:pointer}
.brand b{color:var(--ink)}
.top .fill{flex:1}
.faqbtn{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1.5px solid var(--ink-15);color:var(--blueprint);padding:6px 11px;cursor:pointer;
}
.faqbtn:hover{border-color:var(--blueprint)}
.counter{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--ink-45)}
.counter i{color:var(--ink);font-style:normal;font-weight:600}
.tape{height:6px;width:100%;background:repeating-linear-gradient(115deg,var(--hivis) 0 12px,var(--ink) 12px 24px)}

.shell{
  display:flex;min-height:calc(100vh - 60px);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,rgba(29,78,107,.055) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(29,78,107,.055) 1px,transparent 1px);
  background-size:28px 28px;
}
.spine{
  width:var(--rail);flex:0 0 var(--rail);
  border-right:1px solid var(--ink-15);
  padding:26px 0;display:flex;flex-direction:column;align-items:center;
  position:sticky;top:60px;align-self:flex-start;height:calc(100vh - 60px);
}
.node{width:100%;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.node:disabled{cursor:not-allowed}
.dot{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--ink-15);background:var(--paper-2);
  display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--ink-45);
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.node:not(:disabled):hover .dot{transform:scale(1.14);border-color:var(--blueprint)}
.node[data-state="open"] .dot{border-color:var(--ink);background:var(--hivis);color:var(--ink)}
.node[data-state="passed"] .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.link{width:1.5px;height:22px;background:var(--ink-15)}
.node[data-state="passed"]+.link{background:var(--ok)}

main{flex:1;min-width:0;padding:44px 28px 120px}
.wrap{max-width:var(--maxw);margin:0 auto}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blueprint);margin-bottom:22px}
.thesis{font-size:clamp(28px,4.8vw,46px)}
.thesis .dim{color:var(--blueprint-soft);display:block}
.lede{font-size:19px;color:var(--ink-70);max-width:60ch;margin:26px 0 0}
.herorow{
  display:flex;align-items:center;gap:28px;flex-wrap:wrap;
  margin:26px 0 0;padding-top:22px;border-top:1px solid var(--ink-15);
}
.claim{
  flex:1 1 340px;
  font-size:clamp(18px,2.1vw,21px);font-weight:600;line-height:1.36;
  color:var(--ink);margin:0;max-width:34ch;
  border-left:3px solid var(--hivis);padding-left:16px;
}
.byline{display:flex;align-items:center;gap:12px;margin:0;flex:0 0 auto}
.byline .ava{
  width:52px;height:52px;flex:0 0 52px;border-radius:50%;
  object-fit:cover;object-position:50% 42%;display:block;
  border:1.5px solid var(--ink);background:var(--paper-2);
}
.byline .who-txt .tg{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.04em;
  color:var(--blueprint);border-bottom:1px solid rgba(29,78,107,.3);margin-top:3px;align-self:flex-start;
}
.byline .who-txt .tg:hover{border-bottom-color:var(--blueprint)}
.byline .who-txt{display:flex;flex-direction:column;line-height:1.35}
.byline .who-txt b{font-size:15.5px;font-weight:600}
.byline .who-txt i{
  font-style:normal;font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blueprint);
}

.subs{border:1.5px solid var(--ink);background:var(--paper-2);margin:40px 0 0}
.subs-tape{height:10px;background:repeating-linear-gradient(115deg,var(--hivis) 0 10px,var(--ink) 10px 20px)}
.subs-in{padding:22px}
.subs h3{font-size:19px;margin-bottom:8px}
.subs p{color:var(--ink-70);font-size:15.5px;margin:0 0 18px}
.subs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--ink-15);border:1px solid var(--ink-15)}
.subs-grid a{
  background:var(--paper);padding:13px 15px;border:0;display:flex;flex-direction:column;gap:2px;
  text-decoration:none;transition:background .15s ease;
}
.subs-grid a:hover{background:var(--paper-2)}
.subs-grid .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blueprint)}
.subs-grid .v{font-weight:600;font-size:15px;color:var(--ink)}
.share-cta{
  margin-top:22px;padding:18px 20px;border:1.5px dashed var(--ink-15);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.share-cta p{margin:0;flex:1 1 260px;font-size:15.5px;color:var(--ink-70)}

.who{border:1px solid var(--ink-15);background:var(--paper-2);padding:18px 20px;margin:32px 0;font-size:15.5px}
.who .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blueprint);display:block;margin-bottom:8px}
.who ul{margin:0;padding-left:0;list-style:none}
.who li{position:relative;padding-left:20px;margin-bottom:6px}
.who li::before{content:'';position:absolute;left:2px;top:.62em;width:7px;height:1.5px;background:var(--blueprint)}
.toc{border-top:1px solid var(--ink-15);margin-top:34px}
.toc-row{display:flex;gap:16px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--ink-15)}
.toc-row .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--blueprint);font-weight:600;min-width:26px}
.toc-row .t{font-weight:600}
.toc-row .d{font-size:14px;color:var(--ink-45);margin-left:auto;text-align:right;max-width:46%}

.mhead{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:30px}
.mnum{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;color:var(--blueprint);letter-spacing:.06em}
.mtitle{font-size:clamp(24px,3.6vw,36px);margin-top:8px}
.mkick{color:var(--ink-70);margin-top:10px;font-size:16px}
.steps-bar{display:flex;gap:5px;margin-bottom:26px}
.sbit{height:3px;flex:1;background:var(--ink-15)}
.sbit.on{background:var(--ink)}
.stepnum{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-45);margin-bottom:10px}
.step h3{font-size:22px;margin-bottom:14px}
.step p{margin:0 0 16px}
.step ul{margin:0 0 18px;padding-left:0;list-style:none}
.step ul li{position:relative;padding-left:22px;margin-bottom:9px}
.step ul li::before{content:'';position:absolute;left:2px;top:.62em;width:7px;height:1.5px;background:var(--blueprint)}
.step strong{font-weight:600}
.note{border-left:3px solid var(--hivis);background:var(--paper-2);padding:15px 18px;margin:22px 0;font-size:15.5px}
.note .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blueprint);display:block;margin-bottom:6px}
.note.warn{border-left-color:var(--signal)}
.note.field{border-left-color:var(--blueprint)}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ink-15);vertical-align:top}
th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--blueprint);font-weight:600}

/* сквозной пример: две дорожки */
.track{border:1px solid var(--ink-15);background:var(--paper-2);margin:22px 0}
.track-h{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:10px 16px;border-bottom:1px solid var(--ink-15);display:flex;align-items:baseline;gap:10px;
}
.track-h .tot{margin-left:auto;color:var(--signal);font-weight:600;letter-spacing:.04em}
.track.now .track-h{background:rgba(180,56,31,.07)}
.track.next .track-h{background:rgba(47,107,79,.09)}
.track.next .track-h .tot{color:var(--ok)}
.leg{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ink-15);font-size:14.5px}
.leg:last-child{border-bottom:0}
.leg .d{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-45);min-width:58px;flex:0 0 58px;padding-top:2px}
.leg .w{flex:1}
.leg .w b{font-weight:600}
.leg .w i{font-style:normal;color:var(--ink-45);display:block;font-size:13.5px}

.nav{display:flex;gap:12px;align-items:center;margin-top:34px;padding-top:22px;border-top:1px solid var(--ink-15)}
.btn{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:12px 20px;border:1.5px solid var(--ink);background:var(--paper-2);color:var(--ink);cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--blueprint);border-color:var(--blueprint)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn:disabled:hover{background:var(--paper-2);color:var(--ink)}
.nav .fill{flex:1}

.gate{margin-top:44px;border:1.5px solid var(--ink)}
.gate-tape{height:14px;background:repeating-linear-gradient(115deg,var(--hivis) 0 14px,var(--ink) 14px 28px)}
.gate-body{padding:24px 22px;background:var(--paper-2)}
.gate h3{font-size:19px;margin-bottom:6px}
.gate .req{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-45);letter-spacing:.06em;margin-bottom:22px}
.q{margin-bottom:26px}
.q .qt{font-weight:600;margin-bottom:12px}
.opt{
  display:block;width:100%;text-align:left;border:1.5px solid var(--ink-15);background:var(--paper);
  padding:11px 14px;margin-bottom:8px;cursor:pointer;font:inherit;font-size:15.5px;color:var(--ink);
  transition:border-color .15s ease,background .15s ease;
}
.opt:hover:not(:disabled){border-color:var(--blueprint)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(47,107,79,.09)}
.opt.wrong{border-color:var(--signal);background:rgba(180,56,31,.08)}
.opt .mk{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-45);margin-right:9px}
.why{font-size:14.5px;color:var(--ink-70);border-left:2px solid var(--blueprint-soft);padding-left:13px;margin-top:10px}
.verdict{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;padding:14px 16px;margin-top:6px;border:1.5px solid}
.verdict.pass{border-color:var(--ok);color:var(--ok)}
.verdict.fail{border-color:var(--signal);color:var(--signal)}

/* faq */
.faqitem{border-bottom:1px solid var(--ink-15)}
.faqq{
  width:100%;text-align:left;background:none;border:0;padding:15px 30px 15px 0;cursor:pointer;
  font:inherit;font-weight:600;font-size:16.5px;color:var(--ink);position:relative;
}
.faqq::after{content:'+';position:absolute;right:4px;top:14px;font-family:'IBM Plex Mono',monospace;color:var(--blueprint);font-weight:400;font-size:19px}
.faqitem.open .faqq::after{content:'–'}
.faqa{display:none;padding:0 0 18px;font-size:15.5px;color:var(--ink-70)}
.faqitem.open .faqa{display:block}
.faqa p{margin:0 0 12px}
.faqa p:last-child{margin-bottom:0}
.srcs{font-size:15px}
.srcs li{margin-bottom:12px}


/* термины */
abbr[data-t]{
  text-decoration:none;border-bottom:1.5px dotted var(--blueprint);
  cursor:pointer;color:var(--blueprint);font-weight:500;white-space:nowrap;
}
abbr[data-t]:hover{background:rgba(29,78,107,.08)}
abbr[data-t]::after{content:'?';font-size:.62em;vertical-align:super;margin-left:1px;opacity:.65}

/* шторка с определением */
.sheet-bg{position:fixed;inset:0;background:rgba(11,26,36,.42);z-index:60;display:none}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);
  background:var(--paper-2);border:1.5px solid var(--ink);border-bottom:0;z-index:61;
  padding:0 0 22px;display:none;max-height:78vh;overflow-y:auto;
}
.sheet.on{display:block}
.sheet-tape{height:10px;background:repeating-linear-gradient(115deg,var(--hivis) 0 10px,var(--ink) 10px 20px)}
.sheet-in{padding:20px 22px 0}
.sheet .ab{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blueprint)}
.sheet h4{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em;line-height:1.2}
.sheet .full{font-size:14px;color:var(--ink-45);font-style:italic;margin-bottom:12px}
.sheet .desc{font-size:15.5px;color:var(--ink-70);margin:0 0 16px}
.sheet .close{width:100%;margin-top:4px}

/* глоссарий */
.gl{border-top:1px solid var(--ink-15)}
.gl-item{border-bottom:1px solid var(--ink-15);padding:14px 2px}
.gl-item .ab{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--blueprint)}
.gl-item .tt{font-weight:600;margin:2px 0 2px}
.gl-item .full{font-size:13.5px;color:var(--ink-45);font-style:italic;margin-bottom:5px}
.gl-item .dd{font-size:15px;color:var(--ink-70)}

/* схемы */
.fig{margin:26px 0}
.fig svg{width:100%;height:auto;display:block;border:1px solid var(--ink-15);background:var(--paper-2)}
.fig figcaption{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45);margin-top:8px}

/* нумерованная последовательность */
.seq{counter-reset:s;margin:22px 0;padding:0;list-style:none}
.seq>li{counter-increment:s;position:relative;padding:0 0 18px 46px;border-left:1.5px solid var(--ink-15);margin-left:13px}
.seq>li:last-child{border-left-color:transparent;padding-bottom:0}
.seq>li::before{
  content:counter(s,decimal-leading-zero);position:absolute;left:-14px;top:0;
  width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;display:grid;place-items:center;
}
.seq .st{font-weight:600;display:block;margin-bottom:4px}
.seq .sm{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blueprint);display:block;margin-bottom:6px}
.seq .sq{font-size:15px;color:var(--ink-70);margin-top:7px;border-left:2px solid var(--blueprint-soft);padding-left:12px}

/* подпись */
.sig{
  margin-top:46px;padding-top:14px;border-top:1px solid var(--ink-15);
  display:flex;gap:10px;align-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-45);
}
.sig a{color:var(--ink-45);border-bottom-color:var(--ink-15)}
.sig a:hover{color:var(--blueprint)}
.sig .sp{flex:1}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:70;
  background:var(--ink);color:var(--paper);padding:11px 20px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.toast.on{opacity:1}

@media(max-width:720px){
  :root{--rail:0px}
  body{font-size:16px}
  .shell{flex-direction:column}
  .spine{display:none}
  main{padding:26px 18px 90px}
  .top{padding:10px 14px;gap:10px}
  .thesis{font-size:clamp(24px,6.8vw,31px);line-height:1.18}
  .claim{font-size:17px;padding-left:13px;max-width:100%;flex-basis:100%}
  .herorow{gap:18px;margin-top:22px;padding-top:18px}
  .lede{font-size:17px;margin-top:20px}
  .toc-row{flex-wrap:wrap}
  .toc-row .d{margin-left:0;text-align:left;max-width:100%;flex-basis:100%}
  .mtitle{font-size:clamp(21px,5.6vw,28px)}
  .step h3{font-size:19px}
  table{font-size:14px}
  th,td{padding:8px 8px}
  .leg .d{min-width:50px;flex-basis:50px}
  .nav{flex-wrap:wrap}
  .btn{flex:1;text-align:center;padding:12px 14px}
  .seq>li{padding-left:38px}
  .sheet{width:100%}
  .sig{flex-wrap:wrap;gap:6px 10px;font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <button class="brand" onclick="restart()"><b>AI-PDLC</b> / курс</button>
  <span class="fill"></span>
  <button class="faqbtn" onclick="openGlossary()">Термины</button>
  <button class="faqbtn" onclick="openFaq()">Вопросы</button>
  <button class="faqbtn" onclick="shareCourse()" aria-label="Поделиться">Поделиться</button>
  <span class="counter"><i id="cnt">0</i>/<span id="tot">9</span></span>
</div>
<div class="tape"></div>

<div class="shell">
  <nav class="spine" id="spine" aria-label="Модули курса"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">

const TERMS = {

 'sdlc':{ab:'SDLC',full:'Software Development Life Cycle',d:'Классический жизненный цикл разработки: требования, проектирование, кодирование, тестирование, выпуск, сопровождение. Устроен вокруг того, что координация людей дорога, поэтому работа пакетируется в спринты.'},
 'aidlc':{ab:'AI-DLC',full:'AI-Driven Development Life Cycle',d:'Открытая методология AWS: агент готовит требования, планы, код и тесты, человек проверяет каждый шаг до исполнения. Три фазы — Inception, Construction, Operations. Опубликована в июле 2025, правила открыты в ноябре 2025.'},
 'sdd':{ab:'SDD',full:'Spec-Driven Development',d:'Разработка от спецификации: источником истины становится документ с требованиями, а код, тесты и документация порождаются из него. Изменения вносят в спецификацию, а не в код напрямую.'},
 'idp':{ab:'IDP',full:'Integrated Development Platform',d:'Платформа-операционная система для агентов и разработчиков: каталог инструментов и протоколов подключения, агенты-стражи, управление моделями, наблюдаемость и «золотой путь», по которому задача проходит без ручной сборки окружения. В литературе по платформенной инженерии близким термином называют internal developer platform, но в методологии AI-PDLC аббревиатура раскрывается именно как Integrated Development Platform.'},
 'adlc':{ab:'ADLC',full:'Agent Development Life Cycle',d:'Жизненный цикл самого агента: выбор модели, разработка через автопроверки, выкатка, наблюдение в проде, обнаружение деградации и замена. Отличается от жизненного цикла продукта и живёт параллельно ему.'},
 'harness':{ab:'Harness',full:'Окружение агента',d:'Всё, что находится вокруг модели: доступные инструменты, передаваемый контекст, память между сессиями, ограничители, протоколы и телеметрия. Модель задаёт качество в худшем случае, окружение определяет достижимый максимум.'},
 'bolt':{ab:'Bolt',full:'Болт, рабочий цикл',d:'Замена спринта в AI-DLC: цикл длиной в часы или дни. Команда валидирует предложенный агентом план, агент исполняет, результат проверяют. Пакетировать работу на две недели больше незачем.'},
 'uow':{ab:'Unit of work',full:'Единица работы',d:'Замена эпика: кусок работы такого размера, который агент способен удержать целиком, а человек — оценить за один заход. Если единицу не удаётся удержать в голове, её дробят.'},
 'evals':{ab:'Evals',full:'Автоматические оценки качества ИИ-выходов',d:'Воспроизводимые наборы проверок для вероятностных выходов модели: релевантность, полнота, соответствие политике, отсутствие ухудшения на эталонных сценариях. Важное уточнение: evals — про оценку поведения самой модели или агента. Обычный сгенерированный код проверяется тестами, и называть их evals некорректно, хотя в разговорной речи это часто смешивают.'},
 'evidence':{ab:'Evidence bundle',full:'Комплект доказательств готовности',d:'Что прикладывается к каждой единице работы вместо слова «готово»: спецификация, результаты автопроверок с порогами, заключения политик безопасности, след действий агента. По смыслу — автоматические ПСИ на каждый кусок работы.'},
 'guardian':{ab:'Guardian Agents',full:'Агенты-стражи',d:'Специализированные агенты, проверяющие результат основных: сверяют с политиками, блокируют опасные действия, фиксируют аудиторский след. Способ масштабировать контроль, когда людей на ручную проверку не хватает.'},
 'pac':{ab:'Policy-as-code',full:'Политики как исполняемый код',d:'Требования безопасности и регулятора записаны как автоматические проверки в процессе, а не как документ в вики. При коротком цикле то, что не проверяется автоматически, фактически не соблюдается.'},
 'psi':{ab:'ПСИ',full:'Приёмо-сдаточные испытания',d:'Обязательный гейт перед выпуском в промышленную эксплуатацию с участием службы безопасности, сопровождения и бизнес-пользователей. Российский корпоративный аналог того, что в методологии называют комплектом доказательств.'},
 'r05':{ab:'R0–R5',full:'Уровни прав агента',d:'Лестница разрешений: R0 — только подсказывает; R1 — готовит черновик, применяет человек; R2 — исполняет с подтверждением каждого шага; R3 — исполняет утверждённый план целиком; R4 — работает самостоятельно в очерченной области под автопроверками; R5 — действует без предварительного согласования, контроль по факту. Уровень назначается типу действия по обратимости и цене ошибки, а не команде или модели.'},
 'l05':{ab:'L0–L5',full:'Уровни зрелости организации',d:'L0 — ручной процесс; L1 — ассистент в редакторе у отдельных разработчиков; L2 — ИИ закрывает отдельные этапы; L3 — сквозной процесс с валидацией каждого шага; L4 — агент ведёт единицы работы, контроль автоматический; L5 — скоординированные команды агентов. Шкала нужна, чтобы не перепрыгивать: реалистичный шаг — один уровень за квартал.'},
 'dora':{ab:'DORA',full:'DevOps Research and Assessment',d:'Общепринятый набор из четырёх метрик доставки: частота деплоев, время от коммита до прода, доля неудачных изменений, время восстановления. В версии 2025 года дополнен показателями, связанными с ИИ.'},

 'cicd':{ab:'CI/CD',full:'Continuous Integration / Continuous Delivery',d:'Непрерывная интеграция и доставка: автоматическая сборка, прогон тестов и выкатка при каждом изменении. Базовое условие короткого цикла — без него ускорение упирается в ручные шаги.'},
 'sla':{ab:'SLA',full:'Service Level Agreement',d:'Соглашение об уровне обслуживания: обязательства по доступности и времени отклика. «Три девятки» означают 99,9% доступности, то есть около 8,7 часа простоя в год.'},
 'mvp':{ab:'MVP',full:'Minimum Viable Product',d:'Минимально жизнеспособный продукт: версия с самым коротким набором функциональности, достаточным, чтобы проверить гипотезу на реальных пользователях.'},
 'llm':{ab:'LLM',full:'Large Language Model',d:'Большая языковая модель — то, что стоит в основе агента. Ключевое для планирования: модель определяет качество в худшем случае, а окружение вокруг неё определяет достижимый максимум.'},
 'ctx':{ab:'Контекст',full:'Context window',d:'Объём информации, который модель удерживает за один проход. Прямо влияет на стоимость и качество: чем больше приходится втягивать, чтобы разобраться в задаче, тем дороже проход и выше вероятность ошибки.'},

 'orch':{ab:'Оркестратор',full:'От исполнителя к оркестратору',d:'Качественный сдвиг роли инженера: он перестаёт быть основным исполнителем кода и становится постановщиком задач для агентов, проектировщиком систем и проверяющим результат. Ведёт десятки задач параллельно вместо одной-двух. Меньше глубокой фокусировки на одной задаче, больше решений о качестве и приоритетах.'},
 'ax':{ab:'AX',full:'Agent Experience',d:'Идея о том, что платформа и рабочая среда проектируются под двух разных потребителей: человека и агента. Человеку нужны интерфейсы, исследовательские сессии и понятная валидация; агенту — машиночитаемые API, ограничители, политики эскалации и телеметрия. Это различие определяет профиль каждой роли в команде.'},
 'zf':{ab:'Zero friction',full:'Отсутствие организационных швов',d:'Свойство процесса, при котором на пути от намерения до выпуска нет передач между функциями, отдельной стадии ревью и ожидания согласований. Проверки при этом не исчезают — они встроены в каждый шаг и выполняются автоматически.'},
 'golden':{ab:'Golden dataset',full:'Эталонный набор сценариев',d:'Набор показательных случаев, на котором автоматически проверяется качество: реальные пользовательские сценарии плюс те, на которых система уже ошибалась. Наполнять его надо заранее, иначе вы измеряете историю своих аварий, а не качество продукта.'},
 'af':{ab:'Approval fatigue',full:'Усталость от подтверждений',d:'Состояние, когда запросов на подтверждение больше, чем команда способна осмысленно прочитать, и люди начинают нажимать «да» не глядя. Формально контроль есть, фактически его нет — и это хуже отсутствия контроля, потому что в аудиторском следе появляются подписи, которые ничего не означают. Лечится не дисциплиной, а сокращением числа подтверждений и переносом остальных проверок в автоматику.'},
 'mob':{ab:'Mob elaboration',full:'Совместный разбор требований',d:'Практика фазы Inception: уточняющие вопросы агента разбирает вся команда на одной встрече, а не один аналитик наедине с документом. Именно здесь противоречия в требованиях всплывают в первый день, а не на третьей неделе.'}

function openSheet(id){
  const t=TERMS[id]; if(!t) return;
  document.getElementById('sheetin').innerHTML=
    `<div class="ab">${t.ab}</div><h4>${t.full}</h4><p class="desc">${t.d}</p>`;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheetbg').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('sheetbg').classList.remove('on');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('abbr[data-t]');
  if(a){ e.preventDefault(); openSheet(a.dataset.t); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('on'),2200);
}
async function shareCourse(){
  const url='https://ykononov.com/aipdlc';
  const data={title:'AI-PDLC: как меняется процесс создания продукта с использованием AI',text:'Бесплатный курс: что это, чем отличается от привычной разработки и что меняет в деньгах, людях и контроле',url};
  try{
    if(navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(url);
    toast('Ссылка скопирована');
  }catch(err){ toast(url); }
}

<p>Есть и обратная сторона. Генерация ускоряет написание примерно на треть, но если ревью осталось прежним, в код попадает примерно на четверть больше уязвимостей. Цифра приводится в whitepaper Сбера со ссылкой на отраслевые замеры; в следующем модуле разберём данные подробнее, включая те, что противоречат оптимистичным оценкам. Выигранное время возвращается разборами инцидентов, только позже и дороже.</p>
<p>В крупной компании это чувствуется сильнее, чем в стартапе. Ваш процесс тихо содержит контроли, которые вы перестали замечать: коллега смотрит диффы, в системах остаётся след, релиз проходит приёмо-сдаточные испытания, перед выкаткой проверяется план отката. Все они рассчитаны на человеческую скорость. Когда план, код и тесты появляются за день, механизмы не успевают сработать, а замены им пока нет.</p>
<p>Отсюда правило, вокруг которого построен весь курс: ускорение и контроль внедряются вместе. По отдельности в регулируемом контуре не работает ни то, ни другое.</p>`},

<p>Самая строгая работа на эту тему — рандомизированное контролируемое испытание лаборатории METR, опубликованное в июле 2025 года. Шестнадцать опытных разработчиков открытых проектов, 246 настоящих задач на репозиториях в среднем по миллиону строк. Результат: с ИИ-инструментами задачи заняли <strong>на 19% больше времени</strong>. При этом сами участники были уверены, что ускорились примерно на 20%.</p>

<p>Механизм назвали <strong>налогом на верификацию</strong>: время, сэкономленное на наборе кода, не исчезает, а перемещается вниз по потоку — в ревью и проверку. Большинство конвейеров на такой объём не рассчитаны. Телеметрия Faros по 22 тысячам разработчиков за 2026 год: медианное время в ревью выросло на 441%, размер запросов на слияние — на 51%, и на 31% больше изменений вливается вообще без ревью.</p>

<p>При этом ускорение отдельного разработчика и ускорение поставки — разные вещи. Индивидуальная выработка растёт почти у всех: whitepaper Сбера приводит данные Anthropic за 2025 год — около +50% к производительности в самооценке и +67% слитых запросов на слияние в день. Первая цифра получена опросом, поэтому относиться к ней надо с поправкой на предыдущий шаг. А вот доходит ли это до бизнеса, зависит от того, есть ли у вас автопроверки, короткое релизное окно и способность быстро откатываться.</p>
<div class="note field"><span class="lbl">И ещё: это молодой процесс</span>Методологии, о которых идёт речь, появились в 2025–2026 годах. Практики применения ещё формируются, отраслевого стандарта нет, и через год многое будет выглядеть иначе — какие-то термины отвалятся, какие-то шаги окажутся лишними. Это нормально для любой новой инженерной дисциплины: непрерывная интеграция тоже проходила этот путь. Поэтому относитесь к описанному как к рабочей версии, а не как к устоявшемуся канону — и проверяйте на своих цифрах, а не на чужих.</div>`}

{
  n:'05', min:'5', title:'Куда вкладывать деньги',
  kick:'Почему бюджет идёт в окружение агента, а не в подписки',
  short:'предмет инвестиций',
  steps:[
    {h:'Что такое окружение и почему оно решает',html:`
<p>Формулировка, вокруг которой строится подход: <abbr data-t="llm">LLM</abbr> определяет качество в худшем случае, а окружение — каким оно может стать в лучшем.</p>
<p>Под окружением — на английском <abbr data-t="harness">harness</abbr> — понимают всё, что вокруг модели: какие инструменты ей доступны, какой контекст она получает, что помнит между сессиями, какие стоят ограничители, какая собирается телеметрия. Хорошее окружение со средней моделью обычно обгоняет сильную модель без окружения.</p>
<p>Для владельца отсюда следует практичный вывод про деньги. Вложения в окружение работают и на следующем поколении моделей — вы просто меняете компонент. Вложения в подписки не накапливаются: сменилось поколение, и вы там же, где были.</p>
<div class="note field"><span class="lbl">Проверьте на известном кейсе</span>Самая цитируемая цифра методологии — переделка движка вывода Amazon Bedrock. Энди Джасси в письме акционерам за 2025 год написал, что обычно такую работу делала бы команда из 40 человек примерно за год, а шестеро инженеров сделали новый движок (он называется Mantle) за 76 дней, работая с агентным инструментом Kiro.<br><br>Две оговорки, без которых цифру приводить нельзя. Это заявление компании о собственном проекте, а не независимая проверка. И инженеры, близкие к проекту, публично спорили с такой подачей — говорили, что работа была шире, дольше и уже по охвату, чем в пересказе.<br><br>Но интереснее самой цифры описанные условия: монорепозиторий, код нарезан на мелкие изолированные модули, чтобы агенту нужно было держать в голове меньше, язык выбран за понятные сообщения об ошибках, и каждый инженер просматривал каждую строку перед коммитом. Ни одно из этих решений не про выбор модели — все они про окружение и про людей.</div>`},
    {h:'Спецификация становится главным документом',html:`
<p>Подход называется <abbr data-t="sdd">SDD</abbr> (Spec-Driven Development). Смысл в том, что источником истины делается спецификация, а код, тесты и документация порождаются из неё. Нужно что-то изменить — меняется спецификация, а не код напрямую.</p>
<p>Два следствия, и второе интереснее.</p>
<ul>
<li>Документация перестаёт отставать от кода, потому что она теперь выше по течению, а не отчёт постфактум</li>
<li>Проверка переезжает на уровень требований. Из неправильно понятого требования получается совершенно корректный, рабочий и при этом неправильный код — и на ревью диффа это уже не поймать</li>
</ul>
<p>Второе меняет требования к людям сильнее, чем кажется. Умение вычитать спецификацию на противоречия становится дороже умения вычитывать диффы, и это стоит учитывать, планируя, кого растить и кого нанимать.</p>
<p><strong>Как это выглядит на практике.</strong> Спецификация — не тридцать страниц текста. Обычно это документ на одну-две страницы примерно такой структуры:</p>
<pre># Выгрузка истории операций в CSV

<b>## Зачем</b>
Клиенты просят выгрузку для подачи в налоговую и для
личного учёта. Сейчас пишут в поддержку — около 400
обращений в месяц.

<b>## Что делает</b>
В личном кабинете на странице истории появляется кнопка
«Скачать CSV». Пользователь выбирает период, получает файл
со своими операциями за этот период.

<b>## Правила</b>
- Только собственные операции пользователя
- Период не больше 12 месяцев за одну выгрузку
- Суммы в валюте операции, отдельная колонка — валюта
- Отменённые операции включаются, с признаком в колонке
- Файл в UTF-8 с BOM, разделитель — точка с запятой

<b>## Чего система делать не должна</b>
- Не выгружать операции по закрытым счетам других лиц
- Не блокировать интерфейс: больше 10 тысяч строк —
  готовим файл фоном и присылаем ссылку

<b>## Как проверим</b>
- Пользователь без операций получает файл с заголовками
- Запрос чужого идентификатора возвращает отказ
- Период 13 месяцев отклоняется с понятным сообщением
- Выгрузка 50 тысяч строк не роняет страницу
- Суммы в файле сходятся с суммами на экране</pre>
<p>Обратите внимание на два последних раздела. «Чего система делать не должна» и «как проверим» — это то, что чаще всего забывают, и ровно то, из чего агент порождает тесты. Раздел «зачем» тоже не для красоты: он помогает и агенту, и человеку через полгода понять, почему сделано именно так.</p>
<div class="note warn"><span class="lbl">Ловушка, о которой редко предупреждают</span>Агент пишет и код, и тесты к нему — из одного и того же понимания задачи. Если он понял требование неправильно, тесты подтвердят именно это неправильное понимание, и всё будет зелёным. Отсюда два практических правила. Первое: <strong>эталонные сценарии пишет человек</strong>, отдельно от агента и до генерации, — они и ловят расхождение. Второе: на ревью смотрите не «проходят ли тесты», а «те ли случаи они проверяют».</div>`},
    {h:'Контекст стоит денег',html:`
<p>Чем больше контекста — <abbr data-t="ctx">context window</abbr> — агенту нужно втянуть в себя, чтобы разобраться в задаче, тем дороже проход и тем ниже качество ответа. Отсюда неожиданный поворот в давнем споре про архитектуру.</p>
<p>Раньше модульность обосновывали тем, что так удобнее читать человеку, и на бюджетном комитете это звучало неубедительно. Теперь у неё появилась вторая причина, которую можно посчитать: границы модулей задают объём контекста, а объём контекста прямо определяет стоимость каждого прохода агента и вероятность ошибки.</p>
<div class="note"><span class="lbl">Что это значит для планирования</span>Работа по наведению порядка в коде — разделение на модули, внятные границы, автотесты — перестаёт быть внутренней технической прихотью и становится подготовкой инфраструктуры под новый способ производства. Разговаривать о ней с бизнесом теперь можно теми же словами, что и о закупке оборудования.</div>`}

  n:'06', min:'5', title:'Контроль, безопасность, регулятор',
  kick:'Как ускориться и не потерять то, за что отвечает совет директоров',
  short:'риски и надзор',
  steps:[
    {h:'Третья линия, о которой обычно забывают',html:`
<p>У процесса две очевидные линии: решения о том, что делать и зачем — здесь человек, и реализация — здесь агент. Третья менее заметна, но в большой компании определяет всё: правила, по которым это происходит.</p>
<p>Особенность в том, что правила размазаны по всему процессу, а не собраны в отдельную стадию согласования. Существуют они в виде автоматических проверок, разных уровней прав для агента и следа, который остаётся от каждого действия.</p>
${FIG.lines}
<div class="note"><span class="lbl">Аналогия для разговора с советом директоров</span>Гонка. В боксе продумывают стратегию — это решения. Пилот ведёт машину и выбирает траекторию — это реализация. Телеметрия по температуре тормозов говорит, правильно ли мы едем. А стены, штраф за срезание, ограничение скорости на пит-лейне и обязательный логгер на борту — правила, по которым вообще можно ехать. Пилот не сбрасывает скорость оттого, что телеметрия и регламент работают параллельно. Но без них он либо разложит машину, либо его снимут с гонки.</div>`},
    {h:'Права агента зависят от того, что он может испортить',html:`
<p>Основной инструмент — <abbr data-t="r05">R0–R5</abbr>, лестница разрешений агента. Уровень определяет, где требуется подтверждение человека, какие включены ограничители и нужна ли отдельная автоматическая проверка результата.</p>
<p style="font-size:15px;color:var(--ink-45)">Формулировки уровней ниже — рабочая адаптация под привычный корпоративный язык, а не дословная выдержка из первоисточника. Названия уровней в разных источниках расходятся; важна логика, а не буквы.</p>
<table>
<tr><th>Уровень</th><th>Что делает агент</th><th>Кто подтверждает</th><th>Где уместно</th></tr>
<tr><td><strong>R0</strong><br>подсказка</td><td>Предлагает варианты, ничего не меняет</td><td>Всё делает человек</td><td>Незнакомый домен, первые недели работы команды</td></tr>
<tr><td><strong>R1</strong><br>черновик</td><td>Готовит изменение: код, спецификацию, тесты</td><td>Человек проверяет и применяет сам</td><td>Любые изменения в критичных системах</td></tr>
<tr><td><strong>R2</strong><br>по шагам</td><td>Исполняет, но останавливается на каждом действии</td><td>Человек на каждом шаге</td><td>Миграции данных, необратимые операции</td></tr>
<tr><td><strong>R3</strong><br>по плану</td><td>Исполняет утверждённый план целиком</td><td>Человек один раз — на плане</td><td>Основной рабочий режим для обычных задач</td></tr>
<tr><td><strong>R4</strong><br>в домене</td><td>Работает самостоятельно в очерченной области</td><td>Автопроверки блокируют, человек смотрит выборочно</td><td>Обновление зависимостей, рефакторинг, тесты</td></tr>
<tr><td><strong>R5</strong><br>автономно</td><td>Действует без предварительного согласования</td><td>Guardian-агенты и аудит по факту</td><td>Обратимые действия с низкой ценой ошибки</td></tr>
</table>
<p>Уровень назначается <strong>типу действия, а не команде и не агенту</strong>. В одном и том же продукте правка текста в справке может идти на R5, изменение схемы базы — на R2, а изменение условий действующего договора не поднимется выше R1 никогда.</p>
<div class="note field"><span class="lbl">Как это заполнять у себя</span>Выпишите десяток типовых действий вашей команды и ответьте на два вопроса по каждому: сколько времени займёт откат и кто заметит ошибку — автоматика, сотрудник или клиент. Если откат дороже минут или ошибку первым видит клиент, выше R2 не поднимайтесь. Это первая практическая работа, которую стоит сделать до внедрения, а не после.</div>
<p>Ключевое: уровень назначается по обратимости действия, а не по тому, насколько вы довольны командой или моделью. Поправить текст в справке и изменить процентную ставку по действующему договору не могут иметь одинаковых прав ни при каких обстоятельствах.</p>
<div class="note warn"><span class="lbl">Approval fatigue — ловушка избыточного контроля</span>У этого состояния есть устоявшееся название — <abbr data-t="af">approval fatigue</abbr>. Если подтверждений становится слишком много, люди начинают нажимать «да» не читая. Формально контроль есть, фактически его нет, и это хуже отсутствия: вы уверены, что защищены, а в аудиторском следе стоят подписи, которые ничего не означают. Подтверждений должно быть мало, и каждое — на действии, которое человек реально способен оценить за отведённое время.</div>`},
    {h:'Что придётся закрыть в российском контуре',html:`
<p>Когда людей на ручную проверку перестаёт хватать, контроль масштабируют такими же агентами — их называют <abbr data-t="guardian">Guardian Agents</abbr>, агенты-стражи: их задача — смотреть на результат основного, сверять с политиками, блокировать опасное и фиксировать след. Службу безопасности они не заменяют, а снимают с неё рутину.</p>
<p>Рядом стоит идея <abbr data-t="pac">policy-as-code</abbr>, политики как код — записывать требования как исполняемые правила, а не как документ в вики. Для регулируемой отрасли это единственный работающий путь: ограничение либо проверяется автоматически, либо не соблюдается.</p>
<ul>
<li>Персональные данные — включая те, что попадают в контекст агента и в логи</li>
<li>Где хранятся данные и какие модели вообще допустимы для вашего контура</li>
<li>След действий агента в виде, который можно показать проверяющему</li>
<li>Требования безопасности как автоматические проверки, а не согласование в конце</li>
<li>Новые типы угроз, которых не было в обычной разработке — о них ниже</li>
</ul>
<div class="note warn"><span class="lbl">Три угрозы, которых раньше не было</span><strong>Внедрение инструкций через данные.</strong> Агент читает тикет, письмо, страницу в интернете — и текст оттуда может содержать команду, которую агент выполнит как указание. Лечится тем, что данные и инструкции разделены, а действия ограничены правами уровня.<br><br><strong>Цепочка поставок.</strong> Агент подключает библиотеки. Он может поставить пакет с похожим названием или тот, которого не существует, но который кто-то уже создал специально под такие ошибки. Нужен разрешённый список источников и проверка зависимостей в конвейере.<br><br><strong>Утечка через контекст.</strong> В контекст агента попадает больше, чем вы думаете: куски базы, конфиги, ключи из переменных окружения. Проверьте отдельно, что уходит наружу и что остаётся в логах.</div>
<div class="note field"><span class="lbl">Скорее всего, половина у вас уже есть</span>Если в контуре работают <abbr data-t="psi">ПСИ</abbr> — приёмо-сдаточные испытания — с участием безопасности и сопровождения, протестированный план отката, маскирование данных и логов, журнал аудита — вы уже живёте по принципу «контроль встроен, а не пришит в конце». Задача не построить всё заново, а перевести существующее на скорость короткого цикла. И разговор с безопасностью тогда идёт не про исключения из правил, а про автоматизацию тех же самых правил, что уже приняты.</div>`}
  ],

{
  n:'07', min:'8', title:'Что будет с людьми',
  kick:'Кого нанимать, кого растить и правда ли можно сократить штат',
  short:'команда и роли',
  steps:[
    {h:'Главный вопрос владельца',html:`
<p>Спрашивают обычно так: если агент пишет код, можно ли сократить разработчиков? Ответ короткий — можно, но не в том порядке, в каком хочется.</p>
<p>Известная модель компактных команд — tiny teams на базе <abbr data-t="idp">IDP</abbr> — четверо-шестеро с агентами вместо двух десятков разработчиков — существует и работает. Но компактность там следствие выстроенного окружения: модульного кода, автоматических проверок, встроенного контроля. Если сократить команду до того, как это появилось, вы получите не эффективную маленькую команду, а обычную недоукомплектованную, которая теперь ещё и не успевает проверять то, что генерирует агент.</p>
<div class="note warn"><span class="lbl">Порядок действий имеет значение</span>Сначала окружение, потом изменение размера команды. В обратную сторону это не работает ни разу: подготовка окружения — это работа, и делать её некому, если людей уже сократили.</div>`},
    {h:'Какая работа исчезает и какая появляется',html:`
<p>Полезнее думать не о количестве людей, а о том, чем они заняты. Общий сдвиг описывают как переход <strong>от исполнителя к <abbr data-t="orch">оркестратору</abbr></strong>: инженер перестаёт быть основным исполнителем кода и становится постановщиком задач, проектировщиком систем и проверяющим результат.</p>
<table>
<tr><th>Становится меньше</th><th>Становится больше</th></tr>
<tr><td>Написание типового кода</td><td>Вычитка требований на противоречия</td></tr>
<tr><td>Ручная сборка тестовых данных</td><td>Проектирование автоматических проверок качества</td></tr>
<tr><td>Ревью диффов построчно</td><td>Проверка предложенного плана до исполнения</td></tr>
<tr><td>Написание документации постфактум</td><td>Наблюдение за агентами в проде и разбор деградации</td></tr>
</table>
<p>Вся правая колонка требует более высокой квалификации, а не более низкой. Это и есть ответ на вопрос, почему сокращение не происходит автоматически: работа не исчезает, она смещается вверх по сложности.</p>
<div class="note"><span class="lbl">Что показывают замеры</span>Инженеры фиксируют не сокращение рабочего времени, а рост объёма выпуска: цифры приводятся в whitepaper Сбера со ссылкой на данные Anthropic за 2025 год: около +50% к производительности в самооценке и +67% слитых pull request на инженера в день. Здесь важна оговорка: первая цифра получена опросом, а самооценка в этой области ненадёжна (см. модуль 04). Время на отдельную задачу меняется незначительно, но число выпущенных фич, исправленных дефектов и проверенных гипотез растёт заметно. Оркестратор ведёт десятки задач параллельно вместо одной-двух.</div>`},

{h:'Как меняется каждая роль',html:`
<p>Ни одна роль не исчезает целиком. Меняется то, чем человек занят в течение дня — и вот как это выглядит по каждой.</p>
<table>
<tr><th>Роль</th><th>Чем занималась</th><th>Чем занимается теперь</th></tr>
<tr><td><strong>Разработчик</strong></td><td>Пишет код по задаче</td><td>Ставит задачу агенту, проверяет план до исполнения, отвечает за результат. Ведёт несколько потоков параллельно</td></tr>
<tr><td><strong>Аналитик</strong></td><td>Пишет документ с требованиями</td><td>Ведёт спецификацию как исполняемый артефакт: из неё порождаются код и тесты, изменения вносятся в неё, а не в код</td></tr>
<tr><td><strong>Тестировщик</strong></td><td>Пишет и прогоняет сценарии, собирает данные</td><td>Проектирует автопроверки и эталонный набор, задаёт пороги, которые блокируют продвижение</td></tr>
<tr><td><strong>Архитектор</strong></td><td>Проектирует систему и следит за соответствием</td><td>Тем же плюс границы модулей под объём контекста агента и правила среды исполнения</td></tr>
<tr><td><strong>DevOps / SRE</strong></td><td>Пайплайны, инфраструктура, дежурства</td><td>Тем же плюс среда работы агентов и наблюдение за их поведением в проде</td></tr>
<tr><td><strong>Тимлид</strong></td><td>Распределяет задачи, растит людей</td><td>Тем же плюс настройка уровней прав, порогов проверок и числа подтверждений</td></tr>
<tr><td><strong>Продакт</strong></td><td>Пишет тикеты и приоритизирует</td><td>Формулирует гипотезу результата и участвует в разборе требований вместе с командой на входе</td></tr>
<tr><td><strong>Безопасность</strong></td><td>Согласует перед выпуском</td><td>Оформляет требования как автоматические проверки, которые срабатывают в процессе</td></tr>
<tr><td><strong>Дизайнер</strong></td><td>Проектирует интерфейс для человека</td><td>Тем же плюс участие в проектировании того, что видит и получает агент — это называют <abbr data-t="ax">Agent Experience</abbr></td></tr>
</table>
<div class="note field"><span class="lbl">Честная оговорка</span>Переход в режим оркестратора требует других личных качеств: терпимости к прерываниям, структурного мышления, готовности постоянно проверять чужие решения. Не каждый сильный инженер захочет так работать, и это законный карьерный выбор, а не дефект. Планируя переход, закладывайте, что часть людей останется в глубокой инженерии — и это нормально, такие люди тоже нужны.</div>`},

{h:'Новые роли и когда их заводить',html:`
<p>При масштабе появляются позиции, которых раньше не было. Важная оговорка: заводить их <strong>до</strong> появления объёма работы вредно — получите бюрократию вместо пользы. Сначала закрепите за существующими людьми три сквозные обязанности: разбор требований на входе, качество проверок, среда исполнения. Отдельные роли выделяются, когда одна из них перестаёт помещаться в чью-то основную работу.</p>
<table>
<tr><th>Роль</th><th>За что отвечает</th><th>Когда появляется</th></tr>
<tr><td><strong>Product Engineer</strong></td><td>Сквозная поставка от исследования до прода и проверки результата. Собран из продакта, зрелого инженера и техлида</td><td>Первой — это основной новый профиль</td></tr>
<tr><td><strong>AI Orchestrator</strong></td><td>Поток задач между постановкой и реализацией, переиспользование удачных паттернов</td><td>Когда параллельных агентных сессий больше, чем удерживает один человек</td></tr>
<tr><td><strong>Guardian Agent Engineer</strong></td><td>Система автопроверок, агент-ревьюер, политики эскалации</td><td>Когда ручная проверка перестаёт справляться по объёму</td></tr>
<tr><td><strong>Harness Platform Engineer</strong></td><td>Среда исполнения: инструменты, подключения, долгие процессы</td><td>Когда каждая команда начинает изобретать своё окружение</td></tr>
<tr><td><strong>Context Supply Chain Owner</strong></td><td>Реестр спецификаций, библиотека паттернов, накопленные заметки</td><td>Когда контекст перестаёт помещаться в голову одной команды</td></tr>
<tr><td><strong>AgentOps Engineer</strong></td><td>Наблюдение за агентами в проде, обнаружение деградации, вывод из эксплуатации</td><td>Когда агенты работают в проде постоянно</td></tr>
<tr><td><strong>AI Security Officer</strong></td><td>Моделирование угроз агентных систем, защита от обхода ограничений</td><td>В регулируемых отраслях — рано, в остальных — по мере роста автономии</td></tr>
</table>
<p>Первые четыре забирают основную долю нового объёма работы и материализуются раньше остальных. Остальные либо сохраняют привычный профиль, либо производны от этих четырёх.</p>
<div class="note warn"><span class="lbl">Частая ошибка</span>Нарисовать всю эту таблицу в оргструктуре на старте и начать нанимать под названия должностей. На практике роли вырастают из работы: сначала кто-то в команде фактически начинает заниматься проверками или средой, потом это закрепляется как зона ответственности, и только потом — как позиция в штатном расписании.</div>`},

{h:'Что делать сотруднику, если руководство решило переходить',html:`
<p>Допустим, решение уже принято, и вы узнали о нём на общей встрече. Дальше обычно возникают два вопроса: что теперь будет с моей работой и что делать прямо сейчас. Второй полезнее.</p>
<p><strong>Чему учиться прямо сейчас.</strong> Три навыка дорожают быстрее остальных, и ни один не требует разрешения руководителя.</p>
<ul>
<li><strong>Писать спецификацию, из которой нельзя понять двояко.</strong> Возьмите последнюю свою задачу и опишите её по структуре из предыдущего шага. Отдайте коллеге и попросите найти, где можно понять иначе. Это самый быстрый способ прокачаться</li>
<li><strong>Вычитывать чужой замысел, а не чужой код.</strong> Навык ловить противоречие в требованиях ценится выше, чем скорость набора, и растёт в цене дальше</li>
<li><strong>Придумывать проверки.</strong> Не «как это работает», а «при каких условиях это сломается». Тесты пишет агент, но какие случаи важны — решает человек</li>
</ul>
<p><strong>Как договориться попробовать.</strong> Просить «давайте внедрим методологию» бесполезно. Работает узкая просьба: возьмите одну свою задачу, пройдите её через разбор требований с агентом и запишите, что выяснилось на входе такого, что раньше всплывало бы на третьей неделе. С этим уже можно идти к руководителю — вы приносите не идею, а результат.</p>
<div class="note field"><span class="lbl">Что сказать руководителю</span>«Я попробовал на задаче Х. Разбор требований с агентом занял час, и вылезли три противоречия, которые мы обычно ловим на тестировании. Предлагаю попробовать так же на следующей задаче и посмотреть, повторится ли. Ресурсов дополнительно не нужно.» Такую просьбу трудно отклонить: она маленькая, измеримая и ничего не стоит.</div>
<p>И про страх сокращения честно: работа смещается вверх по сложности, а не исчезает. Ценность теряет тот, кто умел только быстро писать типовой код по готовой постановке. Ценность растёт у того, кто понимает предметную область и умеет задать правильный вопрос к требованию.</p>`},

{h:'Что делать с людьми, которые не хотят',html:`
<p>Сопротивление будет, и оно не всегда иррационально. Разработчик, который двадцать лет наращивал мастерство в написании кода, теряет часть того, за что его ценили, — реагировать на это спокойно тяжело.</p>
<p>Три вещи, которые снижают напряжение сильнее любых презентаций.</p>
<ul>
<li><strong>Честно назвать, что меняется.</strong> Попытка подать это как «просто новый удобный инструмент» не проходит — люди видят, что меняется суть работы, и перестают верить остальному сказанному</li>
<li><strong>Показать, что растёт в цене.</strong> Понимание домена, умение задать правильный вопрос к требованию, чувство архитектуры — всё это дорожает, и у опытных людей этого больше, чем у кого-либо</li>
<li><strong>Не делать раннее внедрение обязательным для всех.</strong> Первая команда должна быть добровольной. Результат первой команды убеждает лучше, чем распоряжение</li>
</ul>
<div class="note field"><span class="lbl">Что стоит зафиксировать сразу</span>Если вы не собираетесь сокращать людей по итогам первого этапа, скажите это прямо и в начале. Иначе команда будет саботировать не методологию, а собственное увольнение, и вы получите честный, но бесполезный результат пилота.</div>`}
  ],
  quiz:[
    {q:'Правда ли, что маленькая команда с агентами заменяет большую?',
     a:['Да, и начинать переход разумнее всего именно с сокращения штата','Да, но компактность — следствие выстроенного окружения, а не способ его получить','Нет, размер команды при таком переходе не меняется вообще никогда'],
     c:1,why:'Сокращение до появления модульности, автопроверок и встроенного контроля даёт недоукомплектованную команду, которая ещё и не успевает проверять результат агента.'},
    {q:'Что происходит с квалификацией требуемых сотрудников?',
     a:['Снижается: агент берёт на себя всё сложное, а людям остаётся простая проверка результата','Растёт: работа смещается к вычитке требований, проектированию проверок и оценке планов','Требования к квалификации остаются примерно такими же, какими были до появления агентов'],
     c:1,why:'Уходит написание типового кода и ручная сборка данных, приходит работа с намерением и качеством. Это ответ, почему сокращение не происходит само собой.'},
    {q:'В чём проблема с начинающими разработчиками?',
     a:['Начинающие хуже работают с агентами, медленнее осваивают инструменты и чаще ошибаются','Типовые задачи, на которых они набирали опыт, уходят к агенту, и воспроизводство кадров ломается','Начинающих нельзя допускать к спецификациям, пока они не научились уверенно писать код'],
     c:1,why:'Работающее решение — раньше переводить их на работу с требованиями и проверками, то есть учить думать о намерении до того, как научили быстро писать код.'},
    {q:'Когда заводить новые роли — Product Engineer, Guardian Agent Engineer и остальные?',
     a:['Сразу: нарисовать в оргструктуре и нанимать под названия должностей','Когда объём работы перестаёт помещаться в чью-то основную занятость','Никогда: хватает существующих ролей'],
     c:1,why:'Преждевременная специализация даёт бюрократию вместо пользы. Сначала за существующими людьми закрепляются три обязанности — разбор требований на входе, качество проверок, среда исполнения, — и роль выделяется, когда одна из них перерастает основную работу.'},
    {q:'Что происходит с ролью инженера в целом?',
     a:['Он становится оператором инструмента, теряет влияние на результат и глубину экспертизы','Он переходит от исполнителя к оркестратору: ставит задачи агентам, проверяет планы, ведёт десятки задач параллельно','Его роль принципиально не меняется, добавляется только новый инструмент'],
     c:1,why:'Замеры показывают не сокращение рабочего времени, а рост объёма выпуска. Профиль работы меняется: меньше глубокой фокусировки на одной задаче, больше решений о качестве и приоритетах.'},
    {q:'Как правильно запускать первую команду?',
     a:['Распоряжением сверху сразу для всех подразделений, чтобы не было отговорок','Добровольно: результат первой команды убеждает лучше приказа','Силами внешнего подрядчика, который уже проходил такой переход'],
     c:1,why:'Сопротивление здесь не иррационально — меняется суть работы. Обязаловка на старте превращает пилот в проверку лояльности вместо проверки гипотезы.'}
  ]
},
{
  n:'08', min:'5', title:'Как считать эффект',
  kick:'Метрики, ложная атрибуция и почему цифру скорости нельзя показывать одну',
  short:'деньги и метрики',
  steps:[
    {h:'Четыре группы показателей',html:`
<p>Чтобы не собирать десяток цифр про одно и то же, метрики удобно держать в четырёх группах.</p>
<table>
<tr><th>Группа</th><th>На какой вопрос отвечает</th><th>Пример</th></tr>
<tr><td>Результат</td><td>Что получил бизнес</td><td>Время от идеи до прода</td></tr>
<tr><td>Качество</td><td>Какой ценой</td><td>Доля релизов с откатом и дефектами</td></tr>
<tr><td>Доверие</td><td>Можно ли на это полагаться</td><td>Доля изменений, по которым можно восстановить, что и почему сделал агент</td></tr>
<tr><td>Здоровье процесса</td><td>Не разъезжается ли всё</td><td>Стоимость единицы результата</td></tr>
</table>
<p>Базой служит <abbr data-t="dora">DORA</abbr> (DevOps Research and Assessment): частота деплоев, время до прода, доля неудачных изменений, время восстановления. Отдельно нужен человек, который ведёт <abbr data-t="adlc">ADLC</abbr>, жизненный цикл самого агента — следит за поведением в проде и замечает, что качество работы поехало, — эта роль в старой структуре не предусмотрена.</p>`},
    {h:'Три способа обмануть самого себя',html:`
<p><strong>Приписать эффект не той причине.</strong> Улучшение произошло, но не от того, что записано в отчёте. Самая частая и самая дорогая ошибка, потому что по ней принимается решение о деньгах.</p>
<div class="note field"><span class="lbl">История из жизни</span>В крупной компании время тестирования сократилось на 30%. В отчёт это попало как эффект от ИИ-ассистентов — их внедряли в том же квартале, и связь выглядела очевидной. При разборе выяснилось другое: сработал отдельный инструмент, который через интеграции с соседними системами сам генерировал тестовые данные. До него тестировщики тратили основной ресурс на то, чтобы найти или собрать данные для регресса, и именно это время исчезло. ИИ к результату отношения не имел.<br><br>Неприятно не то, что в отчёте оказалась неверная строчка. Если бы по этой цифре принимали решение о масштабировании, деньги пошли бы в ассистентов вместо автоматизации тестовых данных — и эффект просто не повторился бы. Отсюда правило: одно заметное изменение за период. Если их два, вы измеряете календарь.</div>
<p><strong>Превратить метрику в цель.</strong> Как только показатель становится целью, он перестаёт что-либо измерять. Доля принятых подсказок агента прекрасно растёт, если ослабить требовательность на ревью.</p>
<p><strong>Верить опросам.</strong> Люди искренне завышают сэкономленное время. Считайте по системам.</p>`},
    {h:'Держите метрики парами',html:`
<p>Три пары, где второй показатель ограничивает первый. Этого достаточно, чтобы вовремя увидеть, что выигрыш покупается слишком дорого.</p>
<ul>
<li><strong>Скорость и качество.</strong> Время до прода против доли релизов с откатом и дефектами. Если растёт и то, и другое, вы не ускорились: сэкономленное время вернётся разборами инцидентов</li>
<li><strong>Самостоятельность и прослеживаемость.</strong> Доля изменений, которые агент делает сам, против доли изменений, по которым сохранилось всё нужное для разбора: из какой спецификации выросло, какой план был утверждён, кем и что проверено, какие права были у агента. Если первая доля растёт быстрее второй — вы уже не сможете разобрать инцидент</li>
<li><strong>Результат и стоимость.</strong> Сколько стоит единица достигнутого результата с учётом расходов на модель. Без этой пары рост самостоятельности агентов тихо съедает бюджет</li>
</ul>
<div class="note"><span class="lbl">Правило отчётности наверх</span>Не показывайте метрику скорости без парной метрики качества на том же слайде. Не из перестраховки: если качество поедет, разговор о причинах роста инцидентов всё равно состоится — но уже без вашего участия в формулировках.</div>`}
  ],
  quiz:[
    {q:'Какая ошибка в измерениях обходится дороже всего?',
     a:['Округление в отчёте','Приписать эффект не той причине','Слишком частый сбор данных'],
     c:1,why:'По этой цифре принимается решение о масштабировании: деньги уйдут не в то, что дало результат, и эффект не повторится.'},
    {q:'Как этого избежать?',
     a:['Вводить одно заметное изменение за период','Чаще опрашивать команду','Отслеживать больше метрик сразу'],
     c:0,why:'Если в квартале изменилось несколько вещей, вы измеряете календарь, а не причину. Либо разносите изменения, либо оставляйте контрольную группу.'},
    {q:'Почему метрику скорости не показывают в одиночку?',
     a:['Так принято в управленческой отчётности и требуют инвесторы','Рост скорости при росте доли откатов и дефектов означает долг, а не ускорение','Одну цифру руководство не поймёт без сравнения с другими показателями'],
     c:1,why:'Пары ограничивают друг друга. Иначе разговор о росте инцидентов состоится позже и без вашего участия в формулировках.'},
    {q:'Что показывает стоимость единицы результата?',
     a:['Расходы на лицензии и подписки в расчёте на одного сотрудника','Во сколько обходится единица достигнутого результата с учётом расходов на модель','Затраты на обучение сотрудников новым инструментам и процессам'],
     c:1,why:'Без этой метрики рост самостоятельности агентов тихо съедает бюджет: работы делается больше, но каждая единица результата дорожает.'}
  ]
},
{
  n:'09', min:'6', title:'С чего начать',
  kick:'Семь шагов первого квартала: что делать, кто отвечает, чем закончится',
  short:'последовательность шагов',
  steps:[
    {h:'Что нужно подготовить заранее',html:`
<p>Обычно на этом месте спрашивают: зачем что-то готовить заранее? Начну со спецификации, а тесты и документацию агент напишет сам.</p>
<p>Так и есть. Напишет. И заложить тесты в спецификацию с самого начала проще, чем потом дописывать их к готовому коду.</p>
<p>Но несколько вещей агент за вас не сделает. Он не создаст место, где эти тесты будут запускаться сами при каждом изменении. Не договорится с вашими людьми о том, что неудачный тест останавливает выпуск. Не научит вашу систему откатываться назад за пять минут. И не вспомнит, во сколько обходилась работа до того, как вы всё поменяли.</p>
<p>Поэтому четыре вопроса ниже — не экзамен на допуск. Начать можно почти из любой точки. Они нужны, чтобы <strong>заранее понимать, что придётся доделать руками</strong>, и снять цифры, пока есть с чем сравнивать.</p>
<table>
<tr><th>Вопрос</th><th>Закроет ли агент</th><th>Что придётся делать людям</th></tr>
<tr><td><strong>Может ли проверка не пропустить релиз?</strong><br><span style="color:var(--ink-45);font-size:14px">Проверка: когда автотесты последний раз остановили выкатку? «Никогда» или «отключаем, когда горит срок» = нет</span></td><td><strong>Да, частично.</strong> Тесты напишет и покроет ими спецификацию</td><td>Место, где они прогоняются автоматически, и договорённость, что красный прогон блокирует выпуск. Текст в спецификации ничего не блокирует</td></tr>
<tr><td><strong>Сможете ли через месяц объяснить, почему система работает именно так?</strong><br><span style="color:var(--ink-45);font-size:14px">Проверка: возьмите изменение прошлой недели и за 10 минут ответьте, зачем его сделали и кто одобрил</span></td><td><strong>Да.</strong> Спецификация и есть ответ на «зачем», и она остаётся в истории</td><td>Связать спецификацию, утверждение и выпуск так, чтобы это поднималось по одному запросу. Иначе через месяц вы будете искать по переписке</td></tr>
<tr><td><strong>Умеете ли быстро вернуть систему назад после неудачного релиза?</strong><br><span style="color:var(--ink-45);font-size:14px">Проверка: когда откат последний раз выполняли или репетировали? Больше 3 месяцев назад = нет</span></td><td><strong>Нет.</strong> Это свойство того, как устроена выкатка</td><td>Собственно возможность отката и её регулярная проверка. Выпусков станет больше — значит, и поводов вернуться назад</td></tr>
<tr><td><strong>Знаете, во сколько обходится задача от постановки до прода?</strong><br><span style="color:var(--ink-45);font-size:14px">Проверка: назовите цифру для типовой задачи прошлого месяца — в деньгах или человеко-днях</span></td><td><strong>Нет.</strong> И задним числом не восстановить</td><td>Снять цифру до начала. Через квартал вы будете доказывать эффект, и сравнивать окажется не с чем</td></tr>
</table>
<p>Обратите внимание на правую колонку: там нет ни слова про модели и промпты. Всё это — либо техника, которую надо один раз настроить, либо договорённости между людьми. Ни то, ни другое из спецификации не появится.</p>
<p>Если правая колонка у вас пустая по всем четырём строкам — начинайте всё равно. Просто знайте заранее, что упрётесь именно сюда, и первый же проход это покажет.</p>
<div class="note field"><span class="lbl">Подготовку тоже можно делать агентом</span>Ту самую работу из правой колонки удобно поручить агенту — Claude Code, Cursor или тому, что у вас используется. Он развернёт запуск тестов при каждом изменении, напишет недостающие проверки на существующий код, соберёт скрипт отката, поднимет сбор метрик из ваших систем. Это сильно короче, чем делать руками: недели превращаются в дни.<br><br>Но полностью эти шаги агент не отменяет, и вот где заканчиваются его возможности. <strong>Решить, что красный тест останавливает выпуск, может только человек</strong> — это договорённость с командой и с бизнесом, а не настройка. <strong>Проверить, что откат действительно работает</strong>, придётся на живой системе, и брать на себя этот риск тоже человеку. <strong>Понять, осмысленны ли написанные тесты</strong>, агент за вас не сможет: он проверит то, что вы описали, включая ошибки в описании. И <strong>цифру «до»</strong> он не восстановит, если её никто не снял.<br><br>Практическое правило: агентом делайте то, что делается один раз и проверяется автоматически. Всё, что требует чьего-то согласия или принятия риска, остаётся людям.</div>
<div class="note warn"><span class="lbl">Чего не делать на этом этапе</span>Не перерисовывайте роли и оргструктуру. Не покупайте подписки на всю компанию. Не объявляйте программу трансформации. Всё это делается по итогам первого прохода, а не до него — иначе вы принимаете решения, не имея ни одной собственной цифры.</div>`},

{h:'Семь шагов первого квартала',html:`
<ol class="seq">
<li><span class="sm">Неделя 1 · вы</span><span class="st">Выбрать команду</span>
Одну. Добровольно, а не распоряжением: сопротивление здесь не иррационально, меняется суть работы. Лучше берите команду со средним, а не лучшим результатом — на сильной всё сработает и ничего не покажет.
<div class="sq">Спросите себя: если эта команда скажет «не получилось», я готов принять такой ответ?</div></li>

<li><span class="sm">Неделя 1 · вы и тимлид</span><span class="st">Выбрать задачу</span>
Настоящую, из бэклога. Среднего размера: с требованиями, тестами и прохождением через безопасность. Не в песочнице — на выдуманной задаче не вылезут те сложности, ради которых всё затевается, и вы ничему не научитесь.
<div class="sq">Спросите себя: эта задача пройдёт через безопасность и релизное окно, как обычная?</div></li>

<li><span class="sm">Неделя 1 · вы</span><span class="st">Снять базовые метрики</span>
До начала: время от идеи до прода, доля релизов с откатом и дефектами, стоимость прохода задачи. Без базы через квартал сравнивать будет не с чем, и разговор об эффекте станет обменом впечатлениями.
<div class="sq">Спросите себя: какие ещё изменения идут в этом периоде? Если есть — вы измеряете календарь.</div></li>

<li><span class="sm">Недели 2–4 · команда</span><span class="st">Провести один полный проход</span>
От постановки до мержа. Назначьте человека, который ведёт записи по ходу: где правили план агента, сколько ушло на проверку против исполнения, что выяснилось в требованиях на входе.
<div class="sq">Спросите себя: команда знает, что мы проверяем гипотезу, а не её продуктивность?</div></li>

<li><span class="sm">Конец месяца 1 · вы</span><span class="st">Собрать два документа</span>
Список контролей, которые не сработали, и цену прохода. Это и есть результат первого месяца — не ускорение. Ускорения в первый месяц не будет, и обещать его наверх не надо.
<div class="sq">Спросите себя: готов ли я показать этот список безопасности целиком, без правок?</div></li>

<li><span class="sm">Месяц 2 · команда и безопасность</span><span class="st">Закрыть найденные дыры</span>
По списку: автопроверки с порогами, след действий, комплект доказательств на каждый кусок работы, уровни прав по обратимости. Здесь же предметный разговор с безопасностью — с предложением автоматизировать уже принятые требования.
<div class="sq">Спросите себя: сколько подтверждений в день получается? Больше десятка — их начнут давать не читая.</div></li>

<li><span class="sm">Месяц 3 · вы</span><span class="st">Проверить переносимость</span>
Ещё две команды: одна на новом проекте, одна на легаси. Цель не скорость, а понимание, что переносится, а что упирается в специфику. Метрики парные с первого дня.
<div class="sq">Спросите себя: результат воспроизвёлся на легаси или держался на удачном выборе первой задачи?</div></li>
</ol>`},
    {h:'Чем закончится квартал и что сказать наверх',html:`
${FIG.plan}
<p>На выходе у вас четыре вещи, и ни одна из них не является обещанием.</p>
<ul>
<li>Измеренный проход на реальной задаче: сколько заняло, где встало, сколько стоило</li>
<li>Закрытый список дыр в контуре контроля, согласованный с безопасностью</li>
<li>Понимание, воспроизводится ли результат на легаси</li>
<li>Стоимость единицы результата — цифра, по которой считается масштабирование</li>
</ul>
<p>Только теперь принимается решение: разворачивать, продолжать точечно или остановиться. Все три исхода допустимы, и третий тоже результат — вы потратили один квартал и одну команду вместо годовой программы.</p>
<div class="note field"><span class="lbl">Три вопроса своему техническому директору</span>Если вы владелец и хотите проверить, что происходит на самом деле, спросите три вещи.<br><br><strong>1. «Покажи цифру до и цифру после по одной конкретной задаче».</strong> Хороший ответ — две цифры и оговорка, что́ ещё менялось в этом периоде. Плохой ответ — «команда говорит, стало быстрее».<br><br><strong>2. «Что у нас сломалось за это время и как мы об этом узнали?».</strong> Хороший ответ — называет случай и говорит, поймала его автоматика или клиент. Плохой — «всё нормально».<br><br><strong>3. «Сколько мы платим за модели в месяц и на что это делится?».</strong> Хороший ответ — цифра и понимание, какая часть на что уходит. Плохой — «немного» или «надо посмотреть».<br><br>Вам не нужно разбираться в технике, чтобы оценить эти ответы. Достаточно услышать, есть за ними цифры или нет.</div>
<div class="note field"><span class="lbl">Формулировка для совета директоров</span>Не «внедряем ИИ в разработку» — на этой формулировке разговор уйдёт в обсуждение хайпа и закончится ничем. Работает другая: за квартал мы получаем измеренный проход на реальной задаче, список дыр в контроле и стоимость единицы результата, и уже после этого принимаем решение о масштабировании. Вы просите не поверить, а дать один квартал и одну команду под понятный результат.</div>
<div class="note warn"><span class="lbl">Шесть способов потратить квартал впустую</span>Поставить ИИ поверх неизменного процесса · сделать пилот на учебной задаче · завалить команду подтверждениями и получить approval fatigue · вложить бюджет в подписки вместо подготовки окружения · отчитываться одной метрикой скорости · перерисовать роли до первой реальной задачи.</div>`}
  ],

const FAQ = [
 {q:'Это не очередной хайп, который через год забудут?',
