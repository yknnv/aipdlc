  a:'Относится, но по-другому. Вы не внедряете методологию сами — вы меняете то, что покупаете и как проверяете. Практически: попросите подрядчика показать спецификации, из которых порождается работа, а не только результат; включите в договор передачу автопроверок вместе с кодом; спросите, как у них устроен откат и есть ли след действий агента. Если подрядчик уже работает с агентами, скорость для вас вырастет — но риск, что вам сдадут непроверенный сгенерированный код, вырастет тоже. Приёмка становится важнее, чем была.'},
 {q:'Кому принадлежит код, который написал агент?',
  a:'Это вопрос к вашим юристам, а не ко мне, и он зависит от юрисдикции и от условий конкретного поставщика модели. Что стоит проверить до начала: условия использования выбранного сервиса — что там сказано о правах на результат и об использовании ваших данных для обучения; договоры с сотрудниками и подрядчиками — покрывают ли они результат, созданный с помощью инструментов; обязательства перед вашими клиентами по конфиденциальности. Отдельный практический риск: агент может воспроизвести фрагмент кода под лицензией, несовместимой с вашей. Проверка лицензий зависимостей и происхождения кода — такая же автоматическая проверка в конвейере, как и остальные.'},
 {q:'Мы не можем поставить текущие проекты на паузу. Как это совместить?',
  a:'Ставить на паузу и не нужно. Первый месяц — это одна команда и одна задача из обычного бэклога, то есть работа, которую вы всё равно собирались делать. Дополнительных ресурсов не требуется, требуется согласие на то, что эта конкретная задача пойдёт медленнее обычного: разбор требований на входе и записи по ходу занимают время. По моему опыту работы с этим стоит закладывать, что первая задача выйдет дольше типовой примерно в полтора раза — это оценка, а не измеренная величина. Это плата за то, чтобы узнать, где у вас дыры, на одной задаче, а не на всём портфеле.'},
 {q:'Что будет с качеством кода?',
  a:'Зависит только от того, что вы сделаете с проверками. Данные показывают: генерация ускоряет написание примерно на треть и при неизменном ревью добавляет около четверти уязвимостей. То есть само по себе качество падает. Оно перестаёт падать, когда проверки становятся автоматическими и блокирующими: регресс, анализ безопасности, оценка на эталонном наборе сценариев (golden dataset). Это и есть основная работа второго месяца в плане внедрения.'},
 {q:'У нас легаси, которому пятнадцать лет. Это вообще применимо?',
  a:'Применимо, но медленнее и с другим первым шагом. Агенту тяжело работать с кодом без внятных границ: чем больше приходится втягивать в контекст, тем ниже качество плана и выше стоимость. Поэтому на легаси первые задачи берут в наиболее изолированных участках, а параллельно занимаются нарезкой на модули — работой, которая и без ИИ была нужна, просто теперь у неё появилось измеримое обоснование. Ожидать пятикратного ускорения на монолите в первый квартал не стоит.'},
 {q:'Через сколько будет виден результат?',
  a:'Первый измеримый результат — через месяц, и это не ускорение. Это список контролей, которые не сработали, и цена прохода одной задачи. Ускорение на уровне отдельных команд обычно проявляется на втором-третьем месяце, а на уровне сроков выхода продуктов — не раньше полугода, потому что до этого выигрыш упирается в неизменённые релизные окна и согласования.'},
 {q:'Нужно ли менять оргструктуру?',
  a:'Не сразу и не по презентации. Структуру осмысленно менять по итогам практики: сначала три команды проходят реальные задачи, потом становится видно, какие роли действительно изменились и где появились новые обязанности — например, кто-то должен следить за поведением агентов в проде. Перерисовка ролей до первого прохода — один из самых распространённых способов потратить квартал впустую.'},
 {q:'А если вендор или модель станут недоступны?',
  a:'Это ровно тот случай, где вложения в окружение окупаются. Методология не привязана к конкретной модели или инструменту: правила процесса, спецификации, автопроверки и след действий остаются вашими. Смена модели превращается в замену компонента с перепрогоном проверок. Именно поэтому не стоит строить процесс вокруг уникальных возможностей одного поставщика — и стоит держать набор эталонных сценариев, на которых новую модель можно быстро сравнить со старой.'},
 {q:'Чем это отличается от того, чтобы просто купить всем Copilot?',
  a:'Тем же, чем покупка станков отличается от перестройки цеха. Ассистент в редакторе ускоряет одну операцию, которая занимает около четверти цикла, — арифметически это даёт 12–15% и теряется в разбросе сроков. Методология меняет порядок работ: требования разбираются с агентом на входе, проверки становятся автоматическими и распределёнными, согласование получает готовый комплект документов. Данные это подтверждают: у компаний с десятью и более сценариями применения ускорение видят 66%, у компаний с пятью и меньше — 35%.'},
 {q:'Зачем оценивать готовность, если можно просто начать со спецификации, а тесты агент напишет сам?',
  a:'Так и есть — начать можно почти из любой точки, и тесты агент действительно напишет. Вопросы готовности нужны не для решения «начинать или нет», а чтобы заранее понимать, что придётся доделать руками. Два пункта из четырёх спецификацией не закрываются в принципе: возможность быстро вернуть систему назад — это свойство того, как устроена выкатка, а не текст в документе; и базовая стоимость прохода задачи, которую нельзя восстановить задним числом. Плюс написанные агентом тесты ничего не блокируют сами по себе — нужно место, где они прогоняются автоматически, и договорённость, что красный прогон останавливает выпуск. При этом саму подготовку тоже разумно делать агентом: развернуть запуск тестов, дописать проверки на существующий код, собрать скрипт отката, поднять сбор метрик — это дни вместо недель. Агент не заменяет только то, что требует чьего-то согласия или принятия риска: решение остановить выпуск по красному тесту, проверку отката на живой системе и оценку того, осмысленны ли написанные проверки.'},
 {q:'Не рано ли этим заниматься? Всё меняется каждый месяц',
  a:'Методологии, о которых речь, появились в 2025–2026 годах, отраслевого стандарта пока нет, и через год многое будет выглядеть иначе. Это правда. Но обратите внимание, что именно устаревает: названия методологий, конкретные инструменты, формулировки шагов. А то, что вы делаете по ходу — автопроверки, порядок в коде, прослеживаемость изменений, быстрый откат, измеренная стоимость работы — полезно при любом развитии событий и не пропадёт, даже если через год всё будет называться иначе. Поэтому разумная стратегия не «ждать стандарта», а вкладываться в то, что переживёт смену моды.'},
 {q:'С чего начать лично мне как руководителю на этой неделе?',
  a:'С четырёх вопросов из восьмого модуля — есть ли блокирующий автоматический регресс, есть ли пригодный для проверки след, проверялся ли откат, известна ли цена прохода задачи. Дальше выберите одну команду, добровольно, и одну настоящую задачу из бэклога. Через месяц у вас будет два документа: список контролей, которые не сработали, и стоимость прохода. С ними уже можно идти к совету директоров, а без них разговор неизбежно сведётся к обсуждению хайпа.'}
];

}


/* варианты перемешиваются один раз при загрузке, чтобы правильный
   не оказывался всегда на одной позиции */
(function shuffleOptions(){
  let seed = 20260818;
  const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  COURSE.forEach(m => m.quiz.forEach(q => {
    const right = q.a[q.c];
    for (let i = q.a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [q.a[i], q.a[j]] = [q.a[j], q.a[i]];
    }
    q.c = q.a.indexOf(right);
  }));
})();

};
const unlocked = i => i===0 || S.passed[i-1];
const view = document.getElementById('view');
const spine = document.getElementById('spine');

function drawSpine(){
  spine.innerHTML='';
  COURSE.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='node';
    b.dataset.state = S.passed[i] ? 'passed' : (S.view==='module'&&S.mod===i ? 'open' : 'idle');
    b.disabled=!unlocked(i);
    b.title = unlocked(i) ? `${m.n} — ${m.title}` : `${m.n} — откроется после теста ${COURSE[i-1].n}`;
    b.setAttribute('aria-label',b.title);
    b.innerHTML=`<span class="dot">${S.passed[i]?'✓':m.n}</span>`;
    b.onclick=()=>{ if(unlocked(i)) openMod(i); };
    spine.appendChild(b);
    if(i<COURSE.length-1){const l=document.createElement('span');l.className='link';spine.appendChild(l);}
  });
  document.getElementById('cnt').textContent = S.passed.filter(Boolean).length;
}

  <p class="lede">Курс о том, что такое AI-PDLC и чем этот подход отличается от привычной разработки. Ключевая мысль: результат определяет среда вокруг модели, а не выбор самой модели. Без установки инструментов и разбора промптов — на уровне того, как устроен сам процесс создания продукта.</p>
  <div class="who">
    <span class="lbl">Для кого</span>
    <p style="margin:0 0 12px">Для всех участников производственных команд и для всех, кто хочет понять, как будет устроен процесс создания продукта в ближайшие годы. Технический бэкграунд не нужен: разбираемся на примере одной задачи, а не на уровне кода.</p>
    <ul>
      <li><strong>Вся производственная команда</strong> — продакт, аналитик, разработчик, тестировщик, дизайнер, DevOps: у каждой роли меняется зона ответственности, и полезнее увидеть это вместе, чем узнать поодиночке</li>
      <li><strong>Технический директор</strong> — решить, вкладываться сейчас или подождать</li>
      <li><strong>Владелец или генеральный</strong> — понять, за что просят бюджет и что получится на выходе</li>
      <li><strong>Руководитель разработки</strong> — внедрять это и объяснять команде</li>
      <li><strong>Инвестор, заказчик, руководитель смежной функции</strong> — понимать, что вам обещают, когда говорят про ИИ в разработке, и какие вопросы задавать</li>
    </ul>
  </div>
  <div class="who" style="margin-top:26px">
    <span class="lbl">Сколько займёт</span>
    <p style="margin:0">Около <strong>52 минут</strong> целиком: по 4–8 минут на модуль плюс короткий тест после каждого. Прогресс держится в рамках одной сессии, поэтому лучше пройти за раз — но можно и по модулю в день.</p>
  </div>
  <p style="color:var(--ink-70);max-width:60ch">Пока тест не пройден, следующий модуль закрыт. Это не геймификация — курс как раз про то, что гейт, который можно проскочить, гейтом не является. Логично начать с себя.</p>
  <div class="toc">
    ${COURSE.map(m=>`<div class="toc-row"><span class="num mono">${m.n}</span><span class="t">${m.title}</span><span class="d">${m.short} · ${m.min} мин</span></div>`).join('')}
  </div>
  <div class="nav">
    <button class="btn primary" onclick="openMod(0)">Начать модуль 01 →</button>
    <span class="fill"></span>
    <button class="btn" onclick="openFaq()">Частые вопросы</button>
  </div>`+SIG;
  window.scrollTo(0,0); drawSpine();
}

function renderModule(){
  const m=COURSE[S.mod];
  const head=`
    <div class="mhead">
      <div class="mnum mono">Модуль ${m.n} <span style="color:var(--ink-45);font-weight:400">· ${m.min} мин</span></div>
      <h2 class="mtitle">${m.title}</h2>
      <p class="mkick">${m.kick}</p>
    </div>`;
  if(S.onGate){ view.innerHTML=head+gateHTML()+SIG; wireGate(); if(!S.keepScroll) window.scrollTo(0,0); S.keepScroll=false; drawSpine(); return; }
  const st=m.steps[S.step];
  const bar=`<div class="steps-bar">${m.steps.map((_,i)=>`<span class="sbit ${i<=S.step?'on':''}"></span>`).join('')}</div>`;
  const last = S.step===m.steps.length-1;
  view.innerHTML=head+bar+`
    <div class="step">
      <div class="stepnum mono">Шаг ${S.step+1} из ${m.steps.length}</div>
      <h3>${st.h}</h3>
      ${st.html}
    </div>
    <div class="nav">
      <button class="btn" ${S.step===0?'disabled':''} onclick="prevStep()">← назад</button>
      <span class="fill"></span>
      <button class="btn primary" onclick="nextStep()">${last?'К тесту →':'Дальше →'}</button>
    </div>`+SIG;
  if(!S.keepScroll) window.scrollTo(0,0);
  S.keepScroll=false;
  drawSpine();
}

function gateHTML(){
  const m=COURSE[S.mod], A=S.answers[S.mod];
  const need=Math.ceil(m.quiz.length*2/3);
  const answered=A.every(x=>x!==null);
  const right=A.filter((x,i)=>x===m.quiz[i].c).length;
  return `
  <div class="gate">
    <div class="gate-tape" role="presentation"></div>
    <div class="gate-body">
      <h3>Проверка по модулю ${m.n}</h3>
      <p class="req mono">нужно верных: ${need} из ${m.quiz.length}</p>
      ${m.quiz.map((q,qi)=>`
        <div class="q">
          <div class="qt">${qi+1}. ${q.q}</div>
          ${q.a.map((opt,oi)=>{
            let cls='opt';
            if(A[qi]!==null){
              if(oi===q.c) cls+=' right';
              else if(oi===A[qi]) cls+=' wrong';
            }
            return `<button class="${cls}" ${A[qi]!==null?'disabled':''} data-q="${qi}" data-o="${oi}"><span class="mk">${'ABCD'[oi]}</span>${opt}</button>`;
          }).join('')}
          ${A[qi]!==null?`<div class="why">${q.why}</div>`:''}
        </div>`).join('')}
      ${answered?`
        <div class="verdict ${right>=need?'pass':'fail'}">
          ${right>=need
            ? `пройдено · ${right} из ${m.quiz.length} · ${S.mod<COURSE.length-1?'модуль '+COURSE[S.mod+1].n+' открыт':'курс завершён'}`
            : `не пройдено · ${right} из ${m.quiz.length} · нужно ${need}`}
        </div>`:''}
      <div class="nav">
        <button class="btn" onclick="backToSteps()">← к материалу</button>
        <span class="fill"></span>
        ${answered ? (right>=need
            ? (S.mod<COURSE.length-1
                ? `<button class="btn primary" onclick="openMod(${S.mod+1})">Модуль ${COURSE[S.mod+1].n} →</button>`
                : `<button class="btn primary" onclick="finish()">Завершить курс →</button>`)
            : `<button class="btn primary" onclick="retry()">Пройти заново</button>`)
          : ''}
      </div>
    </div>
  </div>`;
}

function wireGate(){
  view.querySelectorAll('.opt:not(:disabled)').forEach(b=>{
    b.onclick=()=>{
      const qi=+b.dataset.q, oi=+b.dataset.o;
      if(S.answers[S.mod][qi]!==null) return;
      S.answers[S.mod][qi]=oi;
      const m=COURSE[S.mod], A=S.answers[S.mod];
      if(A.every(x=>x!==null)){
        const right=A.filter((x,i)=>x===m.quiz[i].c).length;
        if(right>=Math.ceil(m.quiz.length*2/3)) S.passed[S.mod]=true;
      }
      const y=window.scrollY;
      S.keepScroll=true;
      renderModule();
      window.scrollTo(0,y);
    };
  });
}

function renderFaq(){
  view.innerHTML=`
  <p class="eyebrow">Справочник · можно открыть в любой момент</p>
  <h2 class="mtitle" style="margin-bottom:14px">Частые вопросы</h2>
  <p class="lede" style="font-size:17px;margin-bottom:30px">Двенадцать вопросов, которые задают на первом же обсуждении — от совета директоров, от безопасности и от самой команды.</p>
  <div id="faqlist">
    ${FAQ.map((f,i)=>`
      <div class="faqitem ${S.faqOpen.has(i)?'open':''}">
        <button class="faqq" data-i="${i}">${f.q}</button>
        <div class="faqa"><p>${f.a}</p></div>
      </div>`).join('')}
  </div>
  <div class="nav">
    <button class="btn primary" onclick="leaveAux()">← вернуться к курсу</button>
  </div>`+SIG;
  view.querySelectorAll('.faqq').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i;
      S.faqOpen.has(i) ? S.faqOpen.delete(i) : S.faqOpen.add(i);
      b.parentElement.classList.toggle('open');
    };
  });
  window.scrollTo(0,0); drawSpine();
}

  view.innerHTML=`
  <p class="eyebrow">Курс пройден · 9 из 9</p>
  <h1 class="thesis" style="font-size:clamp(25px,4.2vw,40px)">Теперь возьмите одну<span class="dim">настоящую задачу.</span></h1>
  <p class="lede">Материал закончился, но результата у него пока нет. Он появится, когда одна команда проведёт через цикл реальную задачу из бэклога и вы получите на руки две вещи: список контролей, которые не сработали, и цену прохода. С этого начинается предметный разговор о масштабировании — до этого он всегда про веру.</p>

    Ответить на четыре вопроса из девятого модуля. Выбрать одну команду — добровольно. Выбрать одну задачу из бэклога, не учебную.</div>

  <h3 style="margin:44px 0 14px;font-size:20px">И ещё одно, напоследок</h3>
  <p style="color:var(--ink-70)">Всё, что здесь написано, — не инструкция, которой надо следовать буквально. Это рабочая основа, собранная из двух открытых методологий и практики управления разработкой в крупной компании. У вас другая компания: другой размер, другой рынок, другая история, другие люди и другие ограничения.</p>
  <p style="color:var(--ink-70)">Поэтому меняйте под себя смело. Возможно, вам не нужны семь шагов — хватит трёх. Возможно, начинать надо не с разработки, а с аналитики, потому что узкое место у вас там. Возможно, ваша безопасность согласится на большее, чем я предполагал, — или на существенно меньшее. Возможно, три месяца окажутся нереальным сроком, и честнее заложить полгода.</p>
  <p style="color:var(--ink-70)">Единственное, что я бы просил не выбрасывать: <strong>снимите цифры до начала и держите метрику скорости в паре с метрикой качества.</strong> Всё остальное подгоняйте под свою ситуацию — это нормальная работа руководителя, а не отступление от методологии.</p>
  <p style="color:var(--ink-70)">И если у вас получится иначе, чем описано, — напишите, мне это интересно: <a href="https://t.me/ykononov" target="_blank" rel="noopener">@ykononov</a> в телеграме. Курс открытый, и разбор чужого опыта делает его точнее.</p>
  <div class="who" style="margin-top:44px">
    <span class="lbl">Об авторе</span>
    <p style="margin:0 0 10px"><strong>Юрий Кононов</strong> — CTO, 15+ лет в IT, из них последние годы — управление 20 командами и 200+ инженерами в одном из крупнейших российских банков: 7 продуктов, 60+ микросервисов, SLA 99,999%.</p>
    <p style="margin:0;color:var(--ink-70)">Курс вырос из практической задачи: понять, как ИИ-нативные методологии переживают контакт с существующими процессами.</p>
  </div>

  <div class="subs">
    <div class="subs-tape"></div>
    <div class="subs-in">
      <h3>Пишу про разработку и управление</h3>
      <p>Статьи и заметки об инженерном менеджменте, ИИ в разработке и о том, как это переживает контакт с большой компанией. Подписывайтесь, где вам удобнее.</p>
      <div class="subs-grid">
        <a href="https://www.linkedin.com/in/ykononov/" target="_blank" rel="noopener"><span class="k">LinkedIn</span><span class="v">in/ykononov</span></a>
        <a href="https://t.me/ykononovmd" target="_blank" rel="noopener"><span class="k">Телеграм-канал</span><span class="v">@ykononovmd</span></a>
        <a href="https://t.me/ykononov" target="_blank" rel="noopener"><span class="k">Телеграм, написать</span><span class="v">@ykononov</span></a>
        <a href="https://www.threads.com/@kononov.md" target="_blank" rel="noopener"><span class="k">Threads</span><span class="v">@kononov.md</span></a>
      </div>
      <div class="share-cta">
        <p><strong>Если курс оказался полезным — передайте его дальше.</strong> Коллеге, который спорит с вами про ИИ в разработке. Руководителю, который просит бюджет. Команде, которой это внедрять. Курс бесплатный и без регистрации, делиться им ничего не стоит.</p>
        <button class="btn primary" onclick="shareCourse()">Поделиться курсом</button>
      </div>
    </div>
  </div>

  <h3 style="margin:40px 0 16px;font-size:20px">Источники</h3>
  <ul class="srcs">
    <li><a href="https://aws.amazon.com/blogs/devops/" target="_blank" rel="noopener">AWS DevOps Blog</a> — исходный пост о методологии AI-DLC, Raja SP, 31 июля 2025</li>
    <li><a href="https://github.com/awslabs/aidlc-workflows" target="_blank" rel="noopener">github.com/awslabs/aidlc-workflows</a> — открытые правила процесса, актуальна версия 2.0</li>

  <div class="note" style="font-size:14.5px"><span class="lbl">Откуда цифры</span>Данные METR, DORA и телеметрия Faros проверены по публикациям этих организаций. Цифры «66% против 35%» и «на 35% быстрее, но на 25% больше уязвимостей», а также показатели Anthropic взяты из whitepaper Сбера — там они приводятся без указания первичного исследования, поэтому проверить их до источника не удалось. Кейс Amazon Bedrock — заявление компании о собственном проекте, оспоренное частью участников. Пример с выгрузкой в CSV, порядок расходов и оценка длительности первой задачи — иллюстрации и личные оценки автора, а не результаты замеров.</div>
  <div class="nav">

    <span class="fill"></span>
    <button class="btn primary" onclick="openFaq()">Частые вопросы</button>
  </div>`+SIG;
  window.scrollTo(0,0); drawSpine();
}

function openMod(i){ if(!unlocked(i))return; S.view='module'; S.mod=i; S.step=0; S.onGate=false; renderModule(); }
function nextStep(){ const m=COURSE[S.mod]; if(S.step<m.steps.length-1){S.step++;} else {S.onGate=true;} renderModule(); }
function prevStep(){ if(S.step>0){S.step--; renderModule();} }
function backToSteps(){ S.onGate=false; S.step=COURSE[S.mod].steps.length-1; renderModule(); }
function retry(){ S.answers[S.mod]=COURSE[S.mod].quiz.map(()=>null); renderModule(); }
function finish(){ S.view='done'; renderDone(); }
function restart(){ S.view='intro'; renderIntro(); }
function openFaq(){ if(S.view!=='faq'&&S.view!=='glossary'){ S.auxFrom=S.view; } S.view='faq'; renderFaq(); }


document.addEventListener('keydown',e=>{
  if(S.view!=='module'||S.onGate) return;
  if(e.key==='ArrowRight') nextStep();
  if(e.key==='ArrowLeft') prevStep();
});

renderIntro();
</script>
